[project]
name = "unghosted-transit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "altair>=6.3.0",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
