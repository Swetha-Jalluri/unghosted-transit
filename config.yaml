# Collection
poll_seconds: 45            # never lower than 45
routes: ["1", "23", "28", "39", "66", "111"]   # confirm route ids from the feed; swap quiet ones

# Feeds
feeds:
  trip_updates: https://cdn.mbta.com/realtime/TripUpdates_enhanced.json
  vehicle_positions: https://cdn.mbta.com/realtime/VehiclePositions_enhanced.json
  gbfs_discovery: https://gbfs.bluebikes.com/gbfs/gbfs.json
  mbta_v3: https://api-v3.mbta.com

# Demo mode
demo_stops: ["1148", "21148", "11148"]  # stops with confirmed vs estimate contrast
mock_dir: tests/fixtures/mock

# Thresholds and tolerances
thresholds:
  stale_location_s: 120
  vanish_margin_s: 120
  dock_stale_s: 300
  unreliable_vanish_rate: 0.25
  min_labels: 300
  min_vanished: 20
  drain_window_min: 20
  walk_m_per_min: 80

# Replay
replay:
  step_sec: 60
